<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thabeha — WhatsApp Business Dashboard</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="whatsapp-dashboard.css" />
</head>
<body>
<div class="app">

  <!-- ══════════════════ LEFT SIDEBAR ══════════════════ -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <div class="brand">
        <img class="brand-logo"
             src="https://cdn.salla.sa/cdn-cgi/image/fit=scale-down,width=400,height=400,onerror=redirect,format=auto/PjvZx/z5c5FGiieo6UGxQ4dlSAM3qtD5blpc4XSqXTPQOD.png"
             alt="Thabeha"
             onerror="this.style.display='none'" />
        <div class="brand-info">
          <span class="brand-name">Thabeha Business</span>
          <span class="brand-number">+966 59 822 0111</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="simulateIncomingBtn" title="Simulate Incoming Message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="icon-btn" id="newChatBtn" title="New Conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
      </div>
    </div>

    <div class="search-wrapper">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search conversations…" autocomplete="off" />
      </div>
    </div>

    <div class="filter-tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="unread">Unread</button>
      <button class="tab" data-filter="bot">Bot Active</button>
    </div>

    <div class="conversation-list" id="conversationList">
      <!-- Rendered by JS -->
    </div>

  </aside>

  <!-- ══════════════════ MAIN CHAT AREA ══════════════════ -->
  <main class="chat-area" id="chatArea">

    <!-- Empty state (default) -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="58" fill="#1f2c34"/>
          <rect x="22" y="38" width="76" height="52" rx="10" fill="#005c4b" opacity="0.7"/>
          <rect x="22" y="38" width="76" height="52" rx="10" stroke="#00a884" stroke-width="1.5"/>
          <rect x="34" y="52" width="52" height="4" rx="2" fill="#00a884" opacity="0.8"/>
          <rect x="34" y="62" width="38" height="4" rx="2" fill="#00a884" opacity="0.5"/>
          <rect x="34" y="72" width="28" height="4" rx="2" fill="#00a884" opacity="0.3"/>
          <circle cx="86" cy="88" r="14" fill="#00a884"/>
          <text x="80" y="93" font-size="14" fill="#fff">🤖</text>
        </svg>
      </div>
      <h2>Thabeha WhatsApp Business</h2>
      <p>Manage all your customer conversations, monitor your bot, and reply manually — all from one place.</p>
      <div class="empty-actions">
        <button class="btn-primary" id="emptySimBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Simulate Incoming Message
        </button>
      </div>
    </div>

    <!-- Chat view (shown when conversation selected) -->
    <div class="chat-view" id="chatView">

      <div class="chat-header">
        <div class="chat-contact" id="chatContact">
          <button class="icon-btn back-btn" id="backBtn" title="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="contact-avatar" id="headerAvatar"></div>
          <div class="contact-details">
            <div class="contact-name" id="headerName"></div>
            <div class="contact-status" id="headerStatus"></div>
          </div>
        </div>
        <div class="chat-actions">
          <div class="bot-toggle-wrap">
            <span class="bot-label">🤖 Bot</span>
            <label class="toggle">
              <input type="checkbox" id="botToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <button class="icon-btn" id="simulateMsgBtn" title="Simulate incoming message from this contact">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="icon-btn" title="More options">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>
      </div>

      <div class="messages-area" id="messagesArea">
        <div class="messages-container" id="messagesContainer">
          <!-- Messages rendered by JS -->
        </div>
        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-bubble">
            <span></span><span></span><span></span>
          </div>
          <span class="typing-label">Bot is typing…</span>
        </div>
      </div>

      <div class="input-area">
        <div class="input-bar">
          <button class="icon-btn emoji-btn" title="Emoji">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <button class="icon-btn attach-btn" title="Attach file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="messageInput" placeholder="Type a message…" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" title="Send message">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- ══════════════════ SIMULATE INCOMING MODAL ══════════════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;margin-right:8px;vertical-align:-3px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Simulate Incoming Message
      </h3>
      <button class="icon-btn" id="modalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <label>From Contact</label>
      <select id="simContact"></select>
      <label>Message Text</label>
      <textarea id="simMessage" placeholder="Type the customer's message…" rows="4"></textarea>
      <div class="quick-replies-label">Quick Replies</div>
      <div class="quick-replies" id="quickReplies"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="modalCancelBtn">Cancel</button>
      <button class="btn-primary" id="modalSendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
        Receive Message
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════ NEW CHAT MODAL ══════════════════ -->
<div class="modal-overlay" id="newChatModal">
  <div class="modal">
    <div class="modal-header">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;margin-right:8px;vertical-align:-3px"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        New Conversation
      </h3>
      <button class="icon-btn" id="newChatClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <label>Customer Name</label>
      <input type="text" id="newName" placeholder="e.g. Ahmed Al-Rashid" autocomplete="off" />
      <label>WhatsApp Number</label>
      <input type="tel" id="newPhone" placeholder="+966 5X XXX XXXX" autocomplete="off" />
      <label>
        <input type="checkbox" id="newBotEnabled" checked style="margin-right:6px;accent-color:#6c35de" />
        Enable Bot for this conversation
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="newChatCancelBtn">Cancel</button>
      <button class="btn-primary" id="newChatCreateBtn">Start Chat</button>
    </div>
  </div>
</div>

<script src="whatsapp-dashboard.js"></script>
</body>
</html>
